
name: GreenHUB Bridge
slug: greenhub_bridge
version: "1.0.0"
description: Bridge Home Assistant → GreenHUB (push)
startup: services
boot: auto
host_network: true
arch:
  - aarch64
  - armv7
  - amd64
options:
  greenhub_webhook_url: "https://dev.escoladeltreball.cat/greenhub/api/ha/webhook/et_centre"
  hmac_secret: ""
  site_code: "et_centre"
  batch_interval_sec: 5
  max_batch_size: 100
  entity_allowlist: []
schema:
  greenhub_webhook_url: str
  hmac_secret: str
  site_code: str
  batch_interval_sec: int
  max_batch_size: int
  entity_allowlist:
    - str?
init: false
map:
  - config:rw
  - ssl:ro
  - share:rw
